<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WhatsWeb — Real-Time Messaging</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="auth-wrapper">
    <div class="auth-card">
      <div class="brand-header">
        <div class="brand-logo">W</div>
        <h1>WhatsWeb</h1>
        <p>Fast, stylish real-time messaging</p>
      </div>

      <div class="auth-tabs">
        <button id="tab-login" class="tab-btn active">Login</button>
        <button id="tab-signup" class="tab-btn">Sign Up</button>
      </div>

      <form id="login-form" class="auth-form">
        <input type="text" id="login-identifier" placeholder="User ID or Mobile Number" required />
        <input type="password" id="login-password" placeholder="Password" required />
        <button type="submit" class="btn-primary">Login</button>
      </form>

      <form id="signup-form" class="auth-form hidden">
        <div class="avatar-upload">
          <img id="avatar-preview" src="https://ui-avatars.com/api/?name=W&background=FF7A00&color=fff" alt="Preview" />
          <label for="signup-photo" class="upload-label">Choose Profile Photo</label>
          <input type="file" id="signup-photo" accept="image/*" hidden />
        </div>
        <input type="text" id="signup-uid" placeholder="User ID (letters, numbers, _)" required />
        <input type="tel" id="signup-mobile" placeholder="Mobile Number (10 digits)" required />
        <input type="password" id="signup-password" placeholder="Password (min 6 chars)" required />
        <button type="submit" class="btn-primary">Create Account</button>
      </form>

      <p id="auth-error" class="error-msg"></p>
    </div>
  </div>

  <!-- MAIN APP SCREEN -->
  <div id="app-screen" class="app-container hidden">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <header class="sidebar-header">
        <div class="user-profile">
          <img id="my-avatar" src="" alt="Me" />
          <div>
            <h3 id="my-uid"></h3>
            <span class="brand-tag">WhatsWeb</span>
          </div>
        </div>
        <div class="header-actions">
          <button id="btn-new-chat" class="btn-icon" title="New Chat">+</button>
          <button id="btn-logout" class="btn-logout" title="Logout">Logout</button>
        </div>
      </header>

      <div id="chat-list" class="chat-list">
        <p class="empty-hint">No chats yet. Tap <strong>+</strong> to start messaging.</p>
      </div>
    </aside>

    <!-- Chat Area -->
    <main id="chat-area" class="chat-area">
      <div id="no-chat-selected" class="no-chat-placeholder">
        <div class="brand-logo large">W</div>
        <h2>Welcome to WhatsWeb</h2>
        <p>Select a conversation or start a new chat using a User ID or Mobile Number.</p>
      </div>

      <div id="active-chat" class="active-chat hidden">
        <header class="chat-header">
          <button id="btn-back" class="btn-back" aria-label="Back">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
          </button>
          <img id="partner-avatar" src="" alt="Partner" />
          <div>
            <h3 id="partner-uid"></h3>
            <span id="partner-mobile" class="sub-text"></span>
          </div>
        </header>

        <div id="messages-box" class="messages-box"></div>

        <!-- Upload Progress Indicator -->
        <div id="upload-status" class="upload-status hidden">Sending attachment...</div>

        <!-- Message Input Bar with 3 Media Icons on the Left -->
        <form id="message-form" class="message-input-area">
          <div class="media-actions">
            <!-- Photo Icon -->
            <button type="button" id="btn-photo" class="media-btn" title="Send Photo" aria-label="Send Photo">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="3" ry="3"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
            </button>
            <input type="file" id="input-photo" accept="image/*" hidden />

            <!-- Video Icon -->
            <button type="button" id="btn-video" class="media-btn" title="Send Video (max 2MB)" aria-label="Send Video">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="23 7 16 12 23 17 23 7"/>
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
              </svg>
            </button>
            <input type="file" id="input-video" accept="video/*" hidden />

            <!-- Document Icon -->
            <button type="button" id="btn-doc" class="media-btn" title="Send Document (max 2MB)" aria-label="Send Document">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
              </svg>
            </button>
            <input type="file" id="input-doc" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.zip" hidden />
          </div>

          <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" />

          <button type="submit" class="btn-send" title="Send" aria-label="Send">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </form>
      </div>
    </main>
  </div>

  <!-- NEW CHAT MODAL -->
  <div id="new-chat-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Start New Chat</h3>
      <p>Enter receiver's User ID or Mobile Number:</p>
      <input type="text" id="search-user-input" placeholder="e.g. aninda_01 or 9876543210" />
      <p id="search-error" class="error-msg"></p>
      <div class="modal-actions">
        <button id="btn-cancel-modal" class="btn-secondary">Cancel</button>
        <button id="btn-start-chat" class="btn-primary">Start Chat</button>
      </div>
    </div>
  </div>

  <!-- IMAGE LIGHTBOX MODAL -->
  <div id="lightbox-modal" class="modal hidden">
    <img id="lightbox-img" class="lightbox-img" src="" alt="Full preview" />
  </div>

  <script type="module" src="app.js?v=3"></script>
</body>
</html>
